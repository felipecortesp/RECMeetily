<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243247"/>
      <stop offset="1" stop-color="#151C28"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF5A5F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF5A5F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- rounded square background (macOS icon proportions) -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bg)"/>
  <!-- microphone capsule -->
  <rect x="404" y="232" width="216" height="392" rx="108" ry="108" fill="#FFFFFF"/>
  <!-- capsule grille lines -->
  <g stroke="#243247" stroke-width="14" stroke-linecap="round" opacity="0.85">
    <line x1="452" y1="330" x2="572" y2="330"/>
    <line x1="452" y1="386" x2="572" y2="386"/>
    <line x1="452" y1="442" x2="572" y2="442"/>
    <line x1="452" y1="498" x2="572" y2="498"/>
  </g>
  <!-- mic cradle -->
  <path d="M328 520 a184 184 0 0 0 368 0" fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round"/>
  <!-- stem and base -->
  <line x1="512" y1="704" x2="512" y2="776" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round"/>
  <line x1="404" y1="792" x2="620" y2="792" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round"/>
  <!-- REC dot with glow -->
  <circle cx="776" cy="248" r="150" fill="url(#glow)"/>
  <circle cx="776" cy="248" r="78" fill="#E5484D"/>
  <circle cx="776" cy="248" r="78" fill="none" stroke="#FFFFFF" stroke-width="14" opacity="0.9"/>
</svg>
